[package]
name = "klicky"
version = "0.1.0"
edition = "2021"

[dependencies]
rodio = "0.19"
symphonia = { version = "0.5", features = ["ogg", "vorbis"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
dirs = "5"
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
