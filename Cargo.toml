[package]
name = "klicky"
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
authors = ["Muneer Alam", "Sauhard Gupta"]
description = "Mechanical keyboard sounds for desktop sessions"
license = "MIT"
repository = "https://github.com/Muneer320/klicky"
homepage = "https://github.com/Muneer320/klicky"
readme = "README.md"
keywords = ["keyboard", "audio", "evdev", "wayland", "mechanical"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false
default-run = "klicky"

[build-dependencies]
embed-resource = "=3.0.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback"] }
symphonia = { version = "0.5", features = ["ogg", "vorbis"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
dirs = "5"
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
cpal-windows = { package = "cpal", version = "=0.18.2", default-features = false }
crossbeam-channel = "=0.5.17"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[package.metadata.deb]
maintainer = "Muneer Alam <muneer.alam320@gmail.com>"
copyright = "2026, Muneer Alam and Sauhard Gupta"
license-file = ["LICENSE", "0"]
depends = "$auto, systemd, udev"
section = "sound"
priority = "optional"
extended-description = """\
Klicky is a small Rust daemon that plays mechanical keyboard sounds for global keypresses. \
On Linux it reads keyboard events directly through evdev, independently of Wayland or X11, \
and sends predecoded samples to one persistent low-latency audio mixer. \
It includes a systemd user service, keyboard-only udev access rule, and ten sound packs."""
maintainer-scripts = "packaging/debian"
changelog = "packaging/debian/changelog"
assets = [
  ["target/release/klicky", "usr/bin/", "755"],
  ["packaging/systemd/klicky-packaged.service", "usr/lib/systemd/user/klicky.service", "644"],
  ["packaging/udev/70-klicky.rules", "usr/lib/udev/rules.d/70-klicky.rules", "644"],
  ["sounds/**/*", "usr/share/klicky/sounds/", "644"],
  ["sounds/LICENSE.md", "usr/share/licenses/klicky/SOUND_RECORDINGS.md", "644"],
  ["README.md", "usr/share/doc/klicky/README.md", "644"],
  ["docs/klicky.1", "usr/share/man/man1/klicky.1", "644"],
]
