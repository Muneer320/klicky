<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Klicky</title>
  <desc id="desc">A low-latency mechanical keyboard sound daemon for Linux</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62d6e8"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="#5d52c9" opacity="0.09"/>
  <circle cx="150" cy="580" r="230" fill="#32b9cf" opacity="0.07"/>

  <g opacity="0.28" stroke="#89a1c7" fill="none">
    <path d="M0 500 C130 440 190 560 310 500 S500 440 620 500 820 560 950 500 1090 440 1200 500"/>
    <path d="M0 525 C130 465 190 585 310 525 S500 465 620 525 820 585 950 525 1090 465 1200 525"/>
  </g>

  <g transform="translate(720 162)" filter="url(#glow)">
    <rect x="0" y="0" width="330" height="205" rx="20" fill="#101827" stroke="url(#accent)" stroke-width="3"/>
    <g fill="#1e2a40" stroke="#6c83a8" stroke-width="1.5">
      <rect x="28" y="30" width="42" height="38" rx="6"/><rect x="78" y="30" width="42" height="38" rx="6"/><rect x="128" y="30" width="42" height="38" rx="6"/><rect x="178" y="30" width="42" height="38" rx="6"/><rect x="228" y="30" width="42" height="38" rx="6"/>
      <rect x="38" y="78" width="42" height="38" rx="6"/><rect x="88" y="78" width="42" height="38" rx="6"/><rect x="138" y="78" width="42" height="38" rx="6"/><rect x="188" y="78" width="42" height="38" rx="6"/><rect x="238" y="78" width="54" height="38" rx="6"/>
      <rect x="28" y="126" width="54" height="38" rx="6"/><rect x="90" y="126" width="42" height="38" rx="6"/><rect x="140" y="126" width="42" height="38" rx="6"/><rect x="190" y="126" width="42" height="38" rx="6"/><rect x="240" y="126" width="52" height="38" rx="6"/>
      <rect x="68" y="174" width="190" height="14" rx="7"/>
    </g>
    <rect x="138" y="78" width="42" height="38" rx="6" fill="url(#accent)" stroke="none"/>
  </g>

  <text x="92" y="205" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="10">KLICKY</text>
  <rect x="94" y="232" width="480" height="5" rx="3" fill="url(#accent)"/>
  <text x="96" y="292" fill="#b9c7df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29">Low-latency mechanical keyboard sounds</text>
  <text x="96" y="335" fill="#7f91ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Native evdev input. Persistent audio mixer. No GUI.</text>

  <g transform="translate(96 395)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">
    <rect width="146" height="44" rx="22" fill="#15263a" stroke="#3cc4d9"/>
    <text x="73" y="28" text-anchor="middle" fill="#8de7f4">WAYLAND</text>
    <rect x="164" width="98" height="44" rx="22" fill="#201d38" stroke="#8b7cf6"/>
    <text x="213" y="28" text-anchor="middle" fill="#c5bcff">X11</text>
    <rect x="280" width="112" height="44" rx="22" fill="#2a1b18" stroke="#e57c4f"/>
    <text x="336" y="28" text-anchor="middle" fill="#ffb28e">RUST</text>
  </g>

  <text x="96" y="558" fill="#60718e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">evdev - PipeWire - CoreAudio - Unix sockets</text>
</svg>
