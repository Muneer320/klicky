name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building a tag never publishes it. Approval and publication are separate.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify version and archive exact source
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$EVENT_NAME" == push ]]; then test "v$version" = "$GITHUB_REF_NAME"; fi
          revision=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'version=%s\nrevision=%s\ntree=%s\n' "$version" "$revision" "$tree" >> "$GITHUB_OUTPUT"
          mkdir dist
          git archive --format=tar.gz --prefix="klicky-$version/" --output="dist/klicky-$version-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: klicky-source
          path: dist/*.tar.gz
          if-no-files-found: error

  unix-checks:
    uses: ./.github/workflows/ci.yml

  windows-checks:
    uses: ./.github/workflows/windows-core.yml

  linux-packages:
    uses: ./.github/workflows/packages.yml

  windows-packages:
    uses: ./.github/workflows/windows-portable.yml

  assemble:
    needs: [source, unix-checks, windows-checks, linux-packages, windows-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: klicky-*
          path: dist
          merge-multiple: true
      - name: Verify assets and write release manifest
        env:
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
          TREE: ${{ needs.source.outputs.tree }}
        run: python3 scripts/assemble-release.py dist --version "$VERSION" --revision "$REVISION" --tree "$TREE"
      - uses: actions/upload-artifact@v4
        with:
          name: klicky-${{ needs.source.outputs.version }}-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Record approval boundary
        run: |
          printf '%s\n' 'Candidate built and checked. Nothing was published.' \
            'Review the manifest, exact-file antivirus results and hardware limits before approving release.' >> "$GITHUB_STEP_SUMMARY"
