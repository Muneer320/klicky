name: Windows unsigned portable bundle

on:
  push:
    paths:
      - src/**
      - sounds/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .gitattributes
      - packaging/windows/**
      - scripts/build-windows-portable.ps1
      - scripts/windows-license-files.ps1
      - docs/WINDOWS.md
      - LICENSE
      - ACKNOWLEDGEMENTS.md
      - .github/workflows/windows-portable.yml
  pull_request:
    paths:
      - src/**
      - sounds/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .gitattributes
      - packaging/windows/**
      - scripts/build-windows-portable.ps1
      - scripts/windows-license-files.ps1
      - docs/WINDOWS.md
      - LICENSE
      - ACKNOWLEDGEMENTS.md
      - .github/workflows/windows-portable.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned MSVC Rust
        run: rustup toolchain install 1.87.0-x86_64-pc-windows-msvc --profile minimal
      - name: Build and verify unsigned development bundle
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: klicky-windows-x64-unsigned-preview
          path: target/windows-dist/*.zip*
          if-no-files-found: error
          retention-days: 14
