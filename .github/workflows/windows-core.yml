name: Windows portable core

on:
  workflow_call:
  push:
    branches: [master]
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - packaging/windows/**
      - .github/workflows/windows-core.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - packaging/windows/**
      - .github/workflows/windows-core.yml

permissions:
  contents: read

concurrency:
  group: windows-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: windows-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.87.0 --profile minimal --component clippy
      - name: Test portable code
        run: cargo +1.87.0 test --locked
      - name: Lint
        run: cargo +1.87.0 clippy --locked --all-targets --all-features -- -D warnings
