name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  omarchy-plugin:
    name: Omarchy plugin export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install QML syntax tools
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: Parse QML and export the curated candidate
        run: |
          for source in packaging/omarchy-bar/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$source" > /dev/null
          done
          python3 scripts/export-omarchy-plugin.py "$RUNNER_TEMP/klicky-bar"
      - uses: actions/upload-artifact@v7
        with:
          name: klicky-bar-development-candidate
          path: ${{ runner.temp }}/klicky-bar/
          if-no-files-found: error

  macos-installation:
    name: macOS lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Install the native app and menu helper
        run: |
          uname -sm
          ./scripts/install-macos.sh --no-start
          ./scripts/install-macos-menu-bar.sh
          launchctl print "gui/$(id -u)/dev.klicky.menu"
      - name: Exercise offline CLI configuration
        run: |
          "$HOME/.local/bin/klicky" --version
          "$HOME/.local/bin/klicky" list
          "$HOME/.local/bin/klicky" switch cherrymx-blue-pbt
          "$HOME/.local/bin/klicky" volume 0.4
          "$HOME/.local/bin/klicky" status
          shasum -a 256 "$HOME/Library/Application Support/klicky/config.toml" > "$RUNNER_TEMP/klicky-config.sha256"
      - name: Remove while preserving settings, then purge
        run: |
          ./scripts/uninstall.sh
          test ! -e "$HOME/.local/bin/klicky"
          test ! -e "$HOME/.local/bin/klicky-menu"
          test ! -e "$HOME/Library/LaunchAgents/dev.klicky.menu.plist"
          shasum -a 256 --check "$RUNNER_TEMP/klicky-config.sha256"
          ./scripts/install-macos.sh --no-start
          ./scripts/uninstall.sh --purge
          test ! -e "$HOME/Library/Application Support/klicky"
      - name: Clean up a partial installation
        if: always()
        run: |
          if [[ -e "$HOME/.local/bin/klicky" || -e "$HOME/.local/bin/klicky-menu" ]]; then
            ./scripts/uninstall.sh --purge
          fi

  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "$($file.Name): $errors" }
          }

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev shellcheck
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Check Linux installer lifecycle
        if: runner.os == 'Linux'
        run: python3 -B -m unittest scripts/test_install_lifecycle.py
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: |
          for script in scripts/*.sh packaging/omarchy-bar/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh packaging/omarchy-bar/*.sh
      - name: Check macOS menu bar helper
        if: runner.os == 'macOS'
        run: |
          swiftc packaging/macos/KlickyMenu.swift -o /tmp/klicky-menu-check
          python3 -B scripts/test-macos-menu.py
      - name: Check GitHub Actions workflows
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            '/tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -ignore 'SC2016:'
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Check systemd unit
        if: runner.os == 'Linux'
        run: |
          install -Dm755 target/release/klicky "$HOME/.local/bin/klicky"
          systemd-analyze --user verify packaging/systemd/klicky.service
