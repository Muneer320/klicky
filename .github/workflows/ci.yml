name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev shellcheck
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
      - name: Check macOS menu bar helper
        if: runner.os == 'macOS'
        run: swiftc packaging/macos/KlickyMenu.swift -o /tmp/klicky-menu-check
      - name: Check GitHub Actions workflows
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            '/tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -ignore 'SC2016:'
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Check systemd unit
        if: runner.os == 'Linux'
        run: |
          install -Dm755 target/release/klicky "$HOME/.local/bin/klicky"
          systemd-analyze --user verify packaging/systemd/klicky.service
