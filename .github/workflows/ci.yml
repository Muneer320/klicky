name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev shellcheck
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Check systemd unit
        if: runner.os == 'Linux'
        run: |
          install -Dm755 target/release/klicky "$HOME/.local/bin/klicky"
          systemd-analyze --user verify packaging/systemd/klicky.service
