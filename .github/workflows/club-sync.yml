name: Propose repository sync

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: club-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'Muneer320/klicky' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        owner: [Muneer320, CherryPick-Student-Projects]
    steps:
      - name: Require the dedicated sync App
        env:
          CLIENT_ID: ${{ vars.CLUB_SYNC_CLIENT_ID }}
          APP_KEY: ${{ secrets.CLUB_SYNC_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Configure the dedicated sync App before activating repository sync. See docs/CLUB_CONTRIBUTIONS.md.'
            exit 1
          fi
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: sync-token
        with:
          client-id: ${{ vars.CLUB_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.CLUB_SYNC_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: klicky
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Propose incoming default-branch changes
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token }}
          SYNC_REPOSITORY: ${{ matrix.owner }}/klicky
        run: |
          python3 scripts/sync-club.py --repository "$SYNC_REPOSITORY"
