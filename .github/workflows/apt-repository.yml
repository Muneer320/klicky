name: Publish APT repository

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apt-repository.yml
      - packaging/apt/**
      - assets/website/**
      - assets/branding/**
      - scripts/build-apt-repository.py
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/uninstall.sh
      - scripts/uninstall.ps1
      - scripts/test_apt_repository_integration.py
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Klicky release tag
        required: true
        default: v0.5.0

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            tag=$RELEASE_TAG
          elif [[ -n "$INPUT_TAG" ]]; then
            tag=$INPUT_TAG
          else
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$tag" != "v$version" ]]; then
            if [[ "$EVENT_NAME" == push ]]; then
              printf 'Keeping the current site: source prepares v%s, latest release is %s.\n' "$version" "$tag" >> "$GITHUB_STEP_SUMMARY"
              printf 'ready=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'Release %s does not match source version %s.\n' "$tag" "$version" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GNUPGHOME: /tmp/klicky-gnupg
      PUBLIC_URL: https://muneer320.github.io/klicky
      EXPECTED_APT_GPG_FINGERPRINT: DBB67AE478D2FFCEC6637B559899E554D3580D8F
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro dpkg-dev apt-utils
      - name: Download and verify release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir download incoming
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'klicky_*_amd64.deb' \
            --pattern SHA256SUMS \
            --dir download
          test "$(find download -name 'klicky_*_amd64.deb' | wc -l)" -eq 1
          test -f download/SHA256SUMS
          (cd download && sha256sum --check SHA256SUMS --ignore-missing)
          package=$(find download -name 'klicky_*_amd64.deb' -print -quit)
          package_name=$(basename "$package")
          checksum_count=$(awk -v name="$package_name" \
            '$2 == name || $2 == "*" name { count++ } END { print count + 0 }' \
            download/SHA256SUMS)
          test "$checksum_count" -eq 1
          version=$(dpkg-deb --field "$package" Version)
          test "$version" = "${RELEASE_TAG#v}-1"
          cp "$package" incoming/
      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_FINGERPRINT: ${{ secrets.APT_GPG_FINGERPRINT }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY"
          test -n "$APT_GPG_PASSPHRASE"
          test "$APT_GPG_FINGERPRINT" = "$EXPECTED_APT_GPG_FINGERPRINT"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$EXPECTED_APT_GPG_FINGERPRINT"
          probe="$RUNNER_TEMP/klicky-signing-probe"
          printf 'Klicky repository signing probe\n' > "$probe"
          printf '%s' "$APT_GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$EXPECTED_APT_GPG_FINGERPRINT" \
              --output "$probe.sig" --detach-sign "$probe"
          gpg --batch --verify "$probe.sig" "$probe"
          gpg --batch --yes \
            --output "$RUNNER_TEMP/klicky-archive-keyring.gpg" \
            --export "$EXPECTED_APT_GPG_FINGERPRINT"
      - name: Fetch and verify published package history
        run: |
          mkdir -p \
            "$RUNNER_TEMP/apt-lists/partial" \
            "$RUNNER_TEMP/apt-cache/archives/partial" \
            existing-packages
          cat > "$RUNNER_TEMP/klicky.sources" <<EOF
          Types: deb
          URIs: $PUBLIC_URL
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: $RUNNER_TEMP/klicky-archive-keyring.gpg
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/klicky.sources"
            -o "Dir::Etc::sourceparts=-"
            -o "Dir::State::lists=$RUNNER_TEMP/apt-lists"
            -o "Dir::Cache::archives=$RUNNER_TEMP/apt-cache/archives"
            -o "APT::Get::List-Cleanup=0"
          )
          apt-get "${apt_options[@]}" update
          apt-cache "${apt_options[@]}" madison klicky |
            awk -F '|' '
              {
                name = $1
                version = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", version)
                if (name == "klicky" && version != "") print version
              }
            ' | sort -u > "$RUNNER_TEMP/klicky-versions"
          test -s "$RUNNER_TEMP/klicky-versions"
          mapfile -t versions < "$RUNNER_TEMP/klicky-versions"
          for version in "${versions[@]}"; do
            (cd existing-packages && \
              apt-get "${apt_options[@]}" download "klicky=$version")
          done
          package_count=$(find existing-packages -maxdepth 1 -type f -name '*.deb' | wc -l)
          test "$package_count" -eq "${#versions[@]}"
      - name: Build and verify complete Pages artifact
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          package=$(find incoming -name 'klicky_*_amd64.deb' -print -quit)
          mkdir -p site
          printf 'klicky.muneer320.tech\n' > site/CNAME
          python3 scripts/test_apt_repository_integration.py \
            --existing-root existing-packages \
            --output site \
            --gnupg-home "$GNUPGHOME" \
            --fingerprint "$EXPECTED_APT_GPG_FINGERPRINT" \
            "$package"
          test "$(cat site/CNAME)" = klicky.muneer320.tech
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
