name: Bug report
description: Report reproducible input, audio, CLI, or packaging behavior
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: related_issue
    attributes:
      label: Related issue
      description: "Optional: link existing work in this repository or the CherryPick fork to avoid duplicate work."
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove passwords, key sequences, device serials, and other sensitive data from logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux Wayland
        - Linux X11
        - macOS
        - Windows 11 x64
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Klicky version (or commit), and desktop/compositor if relevant
      placeholder: Windows 11, Klicky 0.6.1; or Arch Linux, Hyprland, PipeWire
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Microsoft Store
        - Windows installer or portable ZIP
        - Scoop
        - Homebrew
        - APT
        - Arch release package
        - Source or one-line source installer
        - Other or unsure
  - type: input
    id: audio_output
    attributes:
      label: Audio output (for sound issues)
      description: Laptop speakers, wired headphones, Bluetooth or USB audio; no serial numbers needed.
  - type: dropdown
    id: controls
    attributes:
      label: Controls involved (if relevant)
      options:
        - Windows tray
        - macOS menu bar
        - Klicky Bar on Omarchy
        - Older Omarchy toggle
        - Terminal commands
        - None or unsure
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Klicky with...
        2. Press...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Optional: include an error message or relevant diagnostic output, after reviewing it for private data.
        On Linux, `journalctl --user -u klicky.service` may help. For Windows/macOS, use the platform steps in
        https://github.com/Muneer320/klicky/blob/master/docs/TROUBLESHOOTING.md.
        Do not record typing, attach full private logs, or run benchmarks during sensitive work.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed sensitive key data and credentials.
          required: true
        - label: I checked whether the problem still occurs on the latest release (if practical).
