name: Feature request
description: Propose a focused improvement to Klicky
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation or workflow problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Optional: what simpler approaches or existing tools did you consider?"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Linux input
        - macOS input
        - Windows input
        - Desktop controls (Windows tray, macOS menu bar, Omarchy bar)
        - Audio and latency
        - Sound packs
        - CLI and IPC
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits Klicky's keyboard-sound purpose, including its existing desktop helpers, without adding keyboard remapping, macros or collection of typed text.
          required: true
        - label: I searched existing issues and documentation.
          required: true
